# Production compose file for the Linux host.
#
# Brings up the backend (FastAPI/Uvicorn) and the frontend (nginx
# serving the Vite build, reverse-proxying /api and /ws to the backend
# by Compose service name - see frontend/nginx.conf) per
# ARCHITECTURE.md's "Phase 4 - Docker deploy" section.
#
# Usage:
#   cp .env.example .env   # then edit as needed
#   docker compose up -d --build

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: catan-backend:latest
    restart: unless-stopped
    env_file:
      - .env
    # Not published to the host: only the frontend's nginx talks to
    # this service, over the internal "catan" network by service name
    # (see frontend/nginx.conf's proxy_pass targets).
    expose:
      - "8000"
    networks:
      - catan

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_WS_URL: ${VITE_WS_URL:-/ws}
    image: catan-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - catan

networks:
  catan:
    driver: bridge
