# Served inside the frontend runtime image at
# /etc/nginx/conf.d/default.conf (see frontend/Dockerfile).
#
# Serves the built static SPA and reverse-proxies API/WebSocket
# traffic to the backend container by its Docker Compose service name
# ("backend") so the browser only ever talks to this one origin.

# Websocket upgrade helper: only send "Connection: upgrade" when the
# client actually requested an upgrade, otherwise close per spec.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets + SPA client-side routing fallback (Home,
    # CreateRoom, Lobby, Game, GameOver all resolve to index.html).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST: POST /api/rooms etc. -> backend:8000
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket gameplay: /ws/{room_code}?token=... -> backend:8000
    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # These are long-lived connections (a WS stays open for the
        # whole game) - nginx's 60s default read/send timeout would
        # otherwise silently kill an idle-but-connected game socket.
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
